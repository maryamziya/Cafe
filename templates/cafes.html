{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}

{% block content %}

<div class="container">
  <div class="row">
    <div class="col-sm-12">

      <h1>All Cafes</h1>

	  <table class="table table-dark table-striped table-hover">
          <!-- This is where you will write the code to render a Bootstrap 
          Table that contains all the information from the 
          cafe-data.csv file. -->

        <tbody>
            <!-- Outer loop: Iterates through each row (inner list) -->
            {% for row in cafes %}
            <tr>
                <!-- Inner loop: Iterates through each cell item in that row -->
                {% for cell in row %}
                    {% if "http" in cell %}
                        <td><a href="{{ cell }}" class="text-decoration-none" >Maps link</a></td>
                    {% else %}
                        <td>{{ cell }}</td>
                    {% endif %}
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
  	  </table>

      <p><a href="{{ url_for('home') }}">Return to index page</a></p>

    </div>
  </div>
</div>

{% endblock %}
